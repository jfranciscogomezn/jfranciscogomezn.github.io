<title>English Daily 5</title>
<style>
:root{--bg:#0b1020;--card:#141c38;--line:#243056;--text:#e6ebf7;--muted:#9aa6c4;--ok:#4fd1c5;--warn:#ffb86b;--bad:#ff7b8a;--acc:#7c9cff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5;padding:16px;max-width:560px;margin:0 auto}
h1{font-size:22px;margin-bottom:4px}h2{font-size:18px;margin:14px 0 8px}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;border:0;border-radius:10px;padding:12px 16px;background:var(--acc);color:#0b1020;font-weight:700;cursor:pointer}
button.sec{background:transparent;color:var(--text);border:1px solid var(--line)}
button.ok{background:var(--ok)}button.bad{background:var(--bad)}
button:disabled{opacity:.4}
button.full{width:100%;margin-top:10px}
input,textarea{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0e1530;color:var(--text);margin-top:8px}
.expr{font-size:24px;font-weight:800;color:var(--ok)}
.pill{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.bar{height:8px;background:#0e1530;border-radius:99px;overflow:hidden;margin-top:8px}.bar>div{height:100%;background:var(--ok)}
.fb{margin-top:10px;padding:10px;border-radius:10px;font-size:15px}
.fb.good{background:rgba(79,209,197,.12);border:1px solid var(--ok)}.fb.nope{background:rgba(255,123,138,.12);border:1px solid var(--bad)}
.timer{font-family:ui-monospace,monospace;font-size:14px;color:var(--warn)}
.opt{display:block;width:100%;text-align:left;margin-top:8px;background:#0e1530;color:var(--text);border:1px solid var(--line);font-weight:500}
.hidden{display:none}
.gate{border-color:var(--warn)}
small{font-size:12px}
</style>
</head>
<body>

<script>
const REPO='jfranciscogomezn/jfranciscogomezn.github.io', PATH='english/progress.json';
const SALT='fg-english-2026', SESSION_MIN=30, PASS=9;
let ITEMS=[], P=null, SHA=null;
const $=s=>document.querySelector(s);
const app=()=>$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const dow=s=>new Date(s+'T12:00:00').getDay();
const norm=s=>String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?¿¡…"():;]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
const close=(user,target,tol)=>{const u=norm(user),t=norm(target);if(!u)return false;return lev(u,t)<=Math.max(1,Math.floor(t.length*(tol||0.12)))};
const variants=e=>e.split(' / ').map(v=>v.replace(/\(.*?\)/g,'').replace(/…|\.\.\./g,'').trim()).filter(Boolean);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
async function sha6(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,6).toUpperCase()}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function listen(inputSel){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert('Tu navegador no soporta dictado. Usa el micrófono del teclado.');return}const r=new R();r.lang='en-US';r.onresult=e=>{$(inputSel).value=e.results[0][0].transcript};r.start()}
const blockItems=b=>ITEMS.slice((b-1)*5,b*5).map((it,i)=>({...it,n:(b-1)*5+i+1}));
const TOTAL=20;

/* ---------- storage: local + GitHub ---------- */
const token=()=>{try{return localStorage.getItem('gh_token')||''}catch(e){return ''}};
function saveLocal(){try{localStorage.setItem('progress',JSON.stringify(P))}catch(e){}}
function loadLocal(){try{return JSON.parse(localStorage.getItem('progress')||'null')}catch(e){return null}}
const b64e=s=>btoa(unescape(encodeURIComponent(s))), b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
async function pull(){
  const tk=token(); let remote=null;
  try{
    if(tk){const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${PATH}`,{headers:{Authorization:'Bearer '+tk},cache:'no-store'});
      if(r.ok){const j=await r.json();SHA=j.sha;remote=JSON.parse(b64d(j.content))}}
    else{const r=await fetch('progress.json?t='+Date.now(),{cache:'no-store'});if(r.ok)remote=await r.json()}
  }catch(e){}
  const local=loadLocal();
  if(remote&&local) P=(local.updatedAt||'')>(remote.updatedAt||'')?local:remote; else P=remote||local;
  if(!P||!P.version) P={version:1,startDate:null,currentBlock:1,approvals:{},history:[],practiceDays:[],sundays:{},review:[],updatedAt:''};
  saveLocal();
}
let syncMsg='';
async function push(){
  P.updatedAt=new Date().toISOString(); saveLocal();
  const tk=token(); if(!tk){syncMsg='Guardado solo en este celular (configura el token para sincronizar).';return}
  try{
    const body={message:`progress: bloque ${P.currentBlock}`,content:b64e(JSON.stringify(P,null,2)),...(SHA?{sha:SHA}:{})};
    const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${PATH}`,{method:'PUT',headers:{Authorization:'Bearer '+tk,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.ok){SHA=(await r.json()).content.sha;syncMsg='Progreso sincronizado ✔'}else{syncMsg='No se pudo sincronizar ('+r.status+'). Quedó guardado en el celular.';if(r.status===409||r.status===422){await pull()}}
  }catch(e){syncMsg='Sin conexión: guardado en el celular.'}
}

/* ---------- Sunday gate ---------- */
function pendingSunday(){
  if(!P.startDate) return null;
  const t=today(); if(dow(t)===0) return null;              // Sunday itself: no gate yet
  const last=addDays(t,-dow(t));                             // most recent Sunday
  if(last<P.startDate) return null;
  if(P.sundays[last]) return null;
  return last;
}

/* ---------- screens ---------- */
function home(){
  const b=P.currentBlock, ap=(P.approvals[b]||[]), gate=pendingSunday(), t=today();
  const done=b>TOTAL;
  let h=`<h1>English Daily 5</h1><p class="muted">Avanzas solo cuando dominas tus 5 expresiones.</p>`;
  if(done){app().innerHTML=h+`<div class="card"><h2>¡Completaste las 100 expresiones! 🎉</h2><p class="muted">Sigue repasando con la sesión del domingo.</p></div>`;return}
  if(gate){h+=`<div class="card gate"><h2>⛔ Examen del domingo pendiente (${gate})</h2>
    <p class="muted">Antes de seguir, registra el resultado de tu sesión del domingo con Claude.</p>
    <input id="code" placeholder="Código de desbloqueo (6 caracteres)" autocapitalize="characters">
    <button class="full ok" onclick="submitCode('${gate}')">Aprobé: validar código</button>
    <button class="full bad" onclick="failSunday('${gate}')">No aprobé / No hice la sesión</button>
    <div id="gfb"></div></div>`;app().innerHTML=h;return}
  if(dow(t)===0) h+=`<div class="card gate"><b>Hoy es domingo:</b> a las 4:00 PM tienes el examen con Claude. Si ya lo hiciste y aprobaste, ingresa aquí el código.
    <input id="code" placeholder="Código de desbloqueo"><button class="full sec" onclick="submitCode('${t}')">Validar código</button><div id="gfb"></div></div>`;
  const items=blockItems(b);
  h+=`<div class="card"><div class="row"><span class="pill">Bloque ${b} de ${TOTAL}</span><span class="pill">Expresiones ${(b-1)*5+1}–${b*5}</span></div>
  <h2>Tus 5 expresiones</h2>${items.map(it=>`<div style="margin:6px 0"><b>${it.n}. ${esc(it.e)}</b> <span class="muted">— ${esc(it.t)}</span></div>`).join('')}
  <h2>Dominio del bloque</h2><p class="muted">Necesitas aprobar la prueba (≥ ${PASS}/10) en <b>2 días distintos</b>.</p>
  <div class="bar"><div style="width:${Math.min(ap.length,2)*50}%"></div></div>
  <p class="muted" style="margin-top:6px">Aprobaciones: ${ap.length}/2 ${ap.length?'('+ap.join(', ')+')':''}</p>
  ${ap.includes(t)?'<p class="muted">✔ Ya aprobaste hoy. Vuelve mañana para la segunda aprobación.</p>':''}
  <button class="full" onclick="startPractice()">▶ Práctica de ${SESSION_MIN} minutos</button>
  <button class="full sec" onclick="startTest()" ${ap.includes(t)?'disabled':''}>Prueba de dominio</button></div>`;
  if(P.review&&P.review.length) h+=`<div class="card"><b>Repaso obligatorio:</b> ${P.review.map(n=>esc(ITEMS[n-1].e)).join(' · ')}</div>`;
  h+=`<div class="card"><p class="muted">${esc(syncMsg||'')}</p><div class="row"><button class="sec" onclick="howto()">❓ ¿Cómo funciona?</button><button class="sec" onclick="settings()">⚙ Configuración</button></div></div>`;
  app().innerHTML=h;
}
async function submitCode(sun){
  const c=($('#code').value||'').trim().toUpperCase(); const exp=await sha6(`PASS|${P.currentBlock}|${sun}|${SALT}`);
  if(c===exp){P.sundays[sun]={result:'pass',block:P.currentBlock};await push();home()}
  else $('#gfb').innerHTML='<div class="fb nope">Código inválido. Verifica con Claude el código de esta semana.</div>';
}
async function failSunday(sun){
  if(!confirm('Se registrará como NO aprobado y te quedarás en las últimas 5 expresiones. ¿Continuar?'))return;
  const b=P.currentBlock, ap=P.approvals[b]||[];
  if(ap.length===0&&b>1){P.currentBlock=b-1;} P.approvals[P.currentBlock]=[];
  P.sundays[sun]={result:'fail',block:P.currentBlock};
  const nums=prompt('Opcional: números de las expresiones que fallaste con Claude (ej: 7, 12, 15)')||'';
  P.review=[...new Set([...(P.review||[]),...nums.split(/[^0-9]+/).map(Number).filter(n=>n>=1&&n<=100)])];
  await push();home();
}

/* ---------- practice (30 min, 4 exercises per expression) ---------- */
let S=null;
function startPractice(){
  if(!P.startDate){P.startDate=today()}
  const items=blockItems(P.currentBlock);
  const steps=[];
  items.forEach(it=>{steps.push({k:'study',it});[['choice',0],['blank',1],['translate',2],['dictation',3]].forEach(([k,p])=>steps.push({k,it,p}));steps.push({k:'own',it})});
  const prev=ITEMS.slice(0,(P.currentBlock-1)*5).map((it,i)=>({...it,n:i+1}));
  const rev=shuffle([...(P.review||[]).map(n=>({...ITEMS[n-1],n})),...shuffle(prev).slice(0,3)]).slice(0,4);
  rev.forEach(it=>steps.push({k:'choice',it,p:Math.floor(Math.random()*4),review:true}));
  S={steps,i:0,end:Date.now()+SESSION_MIN*60000};
  tick();step();
}
let timerH=null;
function tick(){clearInterval(timerH);timerH=setInterval(()=>{const el=$('#tm');if(!el||!S)return;const s=Math.max(0,Math.round((S.end-Date.now())/1000));el.textContent=`⏱ ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;if(s===0){clearInterval(timerH);el.textContent='⏱ ¡Tiempo! Termina el ejercicio y haz la prueba.'}},1000)}
function hdr(){const st=S.steps[S.i];return `<div class="row" style="justify-content:space-between"><span class="pill">${st.review?'Repaso':'Expresión '+st.it.n} · paso ${S.i+1}/${S.steps.length}</span><span id="tm" class="timer"></span></div><div class="bar"><div style="width:${S.i/S.steps.length*100}%"></div></div>`}
function next(){S.i++;if(S.i>=S.steps.length){finishPractice();return}step()}
function step(){
  const {k,it}=S.steps[S.i]; let h=hdr()+'<div class="card">';
  const sp=t=>`<button class="sec" style="padding:6px 10px" onclick="speak(${JSON.stringify(t).replace(/"/g,'&quot;')})">🔊</button>`;
  const P0=it.pr?it.pr[S.steps[S.i].p||0]:[it.x,it.xs,variants(it.e)[0]];
  if(k==='study'){const exs=it.ex||[[it.x,it.xs]];
    h+=`<p class="muted">Aprende · repite en voz alta la expresión y cada ejemplo</p><div class="row"><div class="expr">${esc(it.e)}</div>${sp(it.e)}</div>
    <p style="margin-top:6px">${esc(it.m)}</p><p class="muted">${esc(it.t)}</p>
    ${exs.map((e,j)=>`<div style="margin-top:10px;display:flex;gap:8px;align-items:flex-start">${sp(e[0])}<div><b>${j+1}.</b> “${esc(e[0])}”<br><span class="muted"><i>${esc(e[1])}</i></span></div></div>`).join('')}
    <button class="full" onclick="next()">Ya los repetí en voz alta ✓</button>`}
  if(k==='choice'){const opts=shuffle([it,...shuffle(ITEMS.filter(o=>o.e!==it.e)).slice(0,3)]);
    h+=`<p class="muted">Ejercicio 1 · ¿Qué expresión completa la frase?</p><p style="font-size:17px;margin-top:6px">“${esc(blankIt(P0[0],P0[2]))}”</p><p class="muted"><i>${esc(P0[1])}</i></p>
    ${opts.map(o=>`<button class="opt" onclick="pick(this,${o.e===it.e})">${esc(o.e)}</button>`).join('')}<div id="fb"></div>`}
  if(k==='blank'){h+=`<p class="muted">Ejercicio 2 · Escribe la parte que falta</p><p style="font-size:17px;margin-top:6px">“${esc(blankIt(P0[0],P0[2]))}”</p><p class="muted"><i>${esc(P0[1])}</i></p>
    <input id="ans" autocomplete="off" autocapitalize="off" placeholder="Escribe la expresión…"><button class="full" onclick="checkBlank()">Revisar</button><div id="fb"></div>`}
  if(k==='translate'){h+=`<p class="muted">Ejercicio 3 · Tradúcelo al inglés (escribe o dicta)</p><p style="font-size:17px;margin-top:6px">“${esc(P0[1])}”</p>
    <textarea id="ans" rows="2" placeholder="Escribe en inglés…"></textarea><div class="row" style="margin-top:8px"><button class="sec" onclick="listen('#ans')">🎤 Dictar</button><button onclick="checkTr()">Revisar</button></div><div id="fb"></div>`}
  if(k==='dictation'){h+=`<p class="muted">Ejercicio 4 · Escucha y escribe exactamente lo que oyes</p>
    <div class="row" style="margin-top:8px"><button onclick="speak(${JSON.stringify(P0[0]).replace(/"/g,'&quot;')})">🔊 Escuchar</button><button class="sec" onclick="speakSlow(${JSON.stringify(P0[0]).replace(/"/g,'&quot;')})">🐢 Más lento</button></div>
    <textarea id="ans" rows="2" placeholder="Escribe lo que escuchaste…"></textarea><button class="full" onclick="checkDict()">Revisar</button><div id="fb"></div>`}
  if(k==='own'){h+=`<p class="muted">Tu turno · Crea tu propia frase con la expresión (sobre tu vida o tu trabajo) y dila en voz alta</p><div class="expr" style="font-size:20px">${esc(it.e)}</div>
    <textarea id="ans" rows="3" placeholder="Tu frase en inglés…"></textarea><div class="row" style="margin-top:8px"><button class="sec" onclick="listen('#ans')">🎤 Dictar</button><button onclick="checkOwn()">Revisar</button></div><div id="fb"></div>`}
  h+='</div>';app().innerHTML=h;if(k==='dictation')setTimeout(()=>speak(P0[0]),400);
}
function blankIt(sent,ans){const i=sent.toLowerCase().indexOf(String(ans).toLowerCase());return i<0?sent:sent.slice(0,i)+'_____'+sent.slice(i+ans.length)}
function speakSlow(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.6;speechSynthesis.speak(u)}catch(e){}}
function cur(){const st=S.steps[S.i],it=st.it;return it.pr?it.pr[st.p||0]:[it.x,it.xs,variants(it.e)[0]]}
function again(k){const st=S.steps[S.i];S.steps.push({k,it:st.it,p:st.p,review:st.review})}
function pick(btn,ok){document.querySelectorAll('.opt').forEach(b=>b.disabled=true);const it=S.steps[S.i].it,p=cur();
  $('#fb').innerHTML=`<div class="fb ${ok?'good':'nope'}">${ok?'¡Correcto!':'La respuesta es: <b>'+esc(it.e)+'</b>'}<br>“${esc(p[0])}”</div><button class="full" onclick="next()">Siguiente</button>`;
  if(!ok)again('choice')}
function checkBlank(){const p=cur(),ok=close($('#ans').value,p[2],0.12);
  $('#fb').innerHTML=`<div class="fb ${ok?'good':'nope'}">${ok?'¡Correcto!':'Respuesta: <b>'+esc(p[2])+'</b>'}<br>“${esc(p[0])}”</div><button class="full" onclick="next()">Siguiente</button>`;
  if(!ok)again('blank')}
function checkDict(){const p=cur(),ok=close($('#ans').value,p[0],0.15);
  $('#fb').innerHTML=`<div class="fb ${ok?'good':'nope'}">${ok?'¡Muy bien, lo entendiste!':'Esto era lo que decía:'}<br><b>${esc(p[0])}</b><br><span class="muted">${esc(p[1])}</span></div><button class="full" onclick="next()">Siguiente</button>`;
  if(!ok)again('dictation')}
function checkTr(){const p=cur(),u=$('#ans').value,ok=close(u,p[0],0.2);
  $('#fb').innerHTML=`<div class="fb ${ok?'good':'nope'}">${ok?'¡Muy bien!':'Revisa la versión natural:'}<br><b>${esc(p[0])}</b></div><div class="row"><button class="sec" onclick="speak(${JSON.stringify(p[0]).replace(/"/g,'&quot;')})">🔊 Escuchar</button><button onclick="next()">Siguiente</button></div>`;
}
function checkOwn(){const it=S.steps[S.i].it,u=norm($('#ans').value);const has=variants(it.e).some(v=>u.includes(norm(v).split(' ').slice(0,2).join(' ')));
  $('#fb').innerHTML=`<div class="fb ${has&&u.split(' ').length>=4?'good':'nope'}">${has&&u.split(' ').length>=4?'Bien. Ahora dila en voz alta 2 veces.':'Tu frase debe incluir la expresión y tener al menos 4 palabras.'}</div>${has&&u.split(' ').length>=4?'<button class="full" onclick="next()">Siguiente</button>':''}`}
async function finishPractice(){clearInterval(timerH);
  if(!P.practiceDays.includes(today()))P.practiceDays.push(today());await push();
  app().innerHTML=`<div class="card"><h2>Práctica completada ✔</h2><p class="muted">Ahora haz la prueba de dominio para sumar una aprobación.</p><button class="full" onclick="startTest()">Prueba de dominio</button><button class="full sec" onclick="home()">Volver al inicio</button></div>`}

/* ---------- mastery test ---------- */
let T=null;
function blankQ(it){for(const v of variants(it.e)){const nv=norm(v);const words=it.x.split(/\s+/);
  const nx=norm(it.x); const idx=nx.indexOf(nv); if(idx>=0&&nv.length>2){
    // rebuild blank on original sentence (approximate by regex, case-insensitive)
    const re=new RegExp(v.replace(/[.*+?^$(){}|[\]\\]/g,'\\$&').replace(/'/g,"['’]").replace(/\s+/g,'[\\s,]+'),'i');
    if(re.test(it.x)) return {q:it.x.replace(re,'_____'),a:[v],hint:it.xs}; }}
  return null}
function startTest(){if(!P.startDate)P.startDate=today();
  const qs=[];blockItems(P.currentBlock).forEach(it=>{
    qs.push({type:'es',it,q:`Escribe en inglés la expresión que significa: “${it.t}”`,a:variants(it.e)});
    let b=null;if(it.ex&&it.ex.length>2){const e=it.ex[1+Math.floor(Math.random()*2)];for(const v0 of variants(it.e)){const v=v0.replace(/[?!.,]+$/,'');const bs=blankIt(e[0],v);if(bs!==e[0]){b={q:bs,a:[v],hint:e[1]};break}}}
    if(!b)b=blankQ(it); qs.push(b?{type:'blank',it,q:'Completa la frase:',s:b.q,a:b.a,hint:b.hint}:{type:'tr',it,q:'Traduce al inglés:',s:it.xs,a:[it.x]});
  });
  T={qs:shuffle(qs),i:0,score:0};testStep()}
function testStep(){const q=T.qs[T.i];
  app().innerHTML=`<div class="row" style="justify-content:space-between"><span class="pill">Prueba · ${T.i+1}/10</span><span class="pill">Aciertos: ${T.score}</span></div>
  <div class="card"><p>${esc(q.q)}</p>${q.s?`<p style="font-size:17px;margin-top:8px">“${esc(q.s)}”</p>`:''}${q.hint?`<p class="muted"><i>${esc(q.hint)}</i></p>`:''}
  <input id="ans" autocomplete="off" autocapitalize="off" placeholder="Tu respuesta"><button class="full" onclick="grade()">Responder</button><div id="fb"></div></div>`;
  $('#ans').focus();$('#ans').onkeydown=e=>{if(e.key==='Enter')grade()}}
function grade(){const q=T.qs[T.i],u=$('#ans').value;if(!u.trim())return;const ok=q.a.some(a=>close(u,a,q.type==='tr'?0.2:0.12));if(ok)T.score++;
  $('#fb').innerHTML=`<div class="fb ${ok?'good':'nope'}">${ok?'¡Correcto!':'Respuesta: <b>'+esc(q.a[0])+'</b>'}</div><button class="full" onclick="nextQ()">${T.i<9?'Siguiente':'Ver resultado'}</button>`;
  document.querySelector('#fb button').focus();$('#ans').disabled=true;document.querySelectorAll('.card>button')[0].disabled=true}
async function nextQ(){T.i++;if(T.i<T.qs.length){testStep();return}
  const b=P.currentBlock,t=today(),pass=T.score>=PASS;P.history.push({date:t,block:b,score:T.score});
  if(!P.practiceDays.includes(t))P.practiceDays.push(t);
  let msg='';
  if(pass){P.approvals[b]=P.approvals[b]||[];if(!P.approvals[b].includes(t))P.approvals[b].push(t);
    if(P.approvals[b].length>=2){P.currentBlock=b+1;P.approvals[P.currentBlock]=[];
      const rv=new Set(blockItems(b).map(i=>i.n));P.review=(P.review||[]).filter(n=>!rv.has(n));
      msg=`🎉 <b>¡Bloque ${b} dominado!</b> Desbloqueaste las expresiones ${b*5+1}–${b*5+5}.`}
    else msg=`✔ Aprobaste (${T.score}/10). Vuelve <b>mañana</b> y aprueba otra vez para desbloquear las siguientes 5.`}
  else msg=`✖ ${T.score}/10. Necesitas ${PASS}/10. Repasa y vuelve a intentarlo: sigues en el bloque ${b}.`;
  await push();
  app().innerHTML=`<div class="card"><h2>Resultado</h2><p>${msg}</p><p class="muted" style="margin-top:8px">${esc(syncMsg)}</p><button class="full" onclick="home()">Inicio</button></div>`}

/* ---------- help ---------- */
function howto(){app().innerHTML=`<h1>¿Cómo funciona?</h1><p class="muted">No avanzas por días: avanzas cuando dominas tus 5 expresiones.</p>
  <div class="card" style="padding:8px">${$('#flow').innerHTML}</div>
  <div class="card"><p class="muted"><b>Tip:</b> si un día no practicas no pasa nada malo, simplemente no avanzas. Si fallas un ejercicio, vuelve a salir al final de la práctica. Las expresiones que falles el domingo quedan en <b>Repaso obligatorio</b>.</p></div>
  <button class="full sec" onclick="home()">Volver</button>`}

/* ---------- settings ---------- */
function settings(){app().innerHTML=`<h1>Configuración</h1>
  <div class="card"><h2>Token de GitHub</h2><p class="muted">Permite guardar tu progreso en <code>${PATH}</code> para que Telegram y Claude sepan en qué bloque vas. Usa un token <b>fine-grained</b> con acceso solo a <b>${REPO}</b> y permiso <b>Contents: Read and write</b>. Se guarda solo en este celular.</p>
  <input id="tk" type="password" placeholder="github_pat_…" value="${token()?'••••••••':''}"><button class="full" onclick="saveTk()">Guardar token</button></div>
  <div class="card"><h2>Estado</h2><pre style="white-space:pre-wrap;font-size:12px;color:var(--muted)">${esc(JSON.stringify(P,null,1))}</pre></div>
  <button class="full sec" onclick="home()">Volver</button>`}
async function saveTk(){const v=$('#tk').value.trim();if(v&&!v.startsWith('•')){try{localStorage.setItem('gh_token',v)}catch(e){}}await pull();await push();alert(syncMsg);home()}

/* ---------- boot ---------- */
(async()=>{try{ITEMS=await (await fetch('items.json',{cache:'no-store'})).json()}catch(e){app().innerHTML='<p>No se pudo cargar la lista.</p>';return}
  await pull();home()})();
</script>
